name: Daily GitHub trend report
on:
  schedule:
    - cron: '17 23 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r automation/requirements.txt
      - run: python automation/collect.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openrouter/free
      - name: Commit snapshot
        run: |
          git config user.name 'github-trend-radar[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data reports
          git diff --cached --quiet || git commit -m "chore: update daily trend snapshot"
          git push
